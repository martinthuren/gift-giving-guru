<!-- FULL CODE SNIPPET: popup.html (with persistent options gear) -->
<!DOCTYPE html>
<html>
<head>
    <title>Save Gift Idea</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="popup.css"> <!-- Link to CSS -->
</head>
<body>
    <div class="container">
        <!-- Header area with Title and Persistent Options Button -->
        <div style="position: relative; border-bottom: 1px solid #eee; margin-bottom: 15px; padding-bottom: 10px;">
            <h3 style="text-align: center; margin: 0; padding: 0;">Save Gift Idea</h3>
            <button id="popup-options-button" title="Open Settings" style="position: absolute; top: -5px; right: -5px; width: auto; padding: 5px 8px; font-size: 1.2em; background: none; border: none; color: #555; cursor: pointer;">
                ⚙ <!-- Gear icon HTML entity -->
            </button>
        </div>

        <!-- Area for status messages (loading, error, success) -->
        <div id="message-area" class="message" style="display: none;"></div>

        <!-- Form for saving the gift (hidden initially or if API key missing) -->
        <form id="save-gift-form" style="display: none;">
             <div class="form-group">
                 <label>Page Title:</label>
                 <p id="page-title" class="page-info">Loading...</p> <!-- Placeholder text -->
             </div>
             <div class="form-group">
                 <label>URL:</label>
                 <p id="page-url" class="page-info">Loading...</p> <!-- Placeholder text -->
             </div>
            <div class="form-group">
                <label for="person-select">Save for Person:*</label>
                <select id="person-select" required>
                    <option value="" disabled selected>-- Loading People --</option>
                    <!-- Options will be populated by popup.js -->
                </select>
            </div>
             <div class="form-group">
                 <label for="notes">Notes (Optional):</label>
                 <textarea id="notes" rows="3"></textarea>
             </div>

            <button type="submit" id="save-button">Save Idea</button>
        </form>

        <!-- Prompt shown if API Key is missing -->
         <div id="setup-prompt" style="display: none;">
             <p>Please set up your API Key!</p>
             <ol>
                 <li>Generate an API Key in the <a href="#" id="website-link-popup" target="_blank">Gift Guru website settings</a>.</li>
                 <li>Open Extension Options (click the gear icon ⚙️ above or the button below) and paste the key.</li>
             </ol>
             <button id="open-options-button">Open Options Page</button> <!-- Button within the prompt -->
         </div>

    </div>
    <script src="popup.js"></script> <!-- Link to JavaScript -->
</body>
</html>
