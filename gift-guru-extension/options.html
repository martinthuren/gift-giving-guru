<!DOCTYPE html>
<html>
<head>
    <title>Gift Guru Helper Options</title>
    <meta charset="UTF-8">
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 500px; margin: auto; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="password"] { width: 100%; padding: 8px; margin-bottom: 15px; border: 1px solid #ccc; box-sizing: border-box; }
        button { padding: 10px 15px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        #status { margin-top: 15px; padding: 10px; border-radius: 4px; text-align: center; font-weight: bold; }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb;}
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb;}
    </style>
</head>
<body>

    <h1>Gift Guru Helper Options</h1>

    <p>
        To connect this extension to your account, please generate an API key on the
        <a href="#" id="website-link" target="_blank">Gift Giving Guru website</a> (Settings page)
        and paste it below.
    </p>

    <div>
        <label for="api-key">API Key:</label>
        <!-- Use type="password" to mask the key -->
        <input type="password" id="api-key" placeholder="Paste your API Key here">
    </div>

    <button id="save-button">Save API Key</button>

    <div id="status" style="display: none;"></div> <!-- For success/error messages -->

    <script src="options.js"></script>
</body>
</html>
